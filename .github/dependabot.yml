# GitHub Actions only. Every action in ci.yml is SHA pinned with a version
# comment, which is correct and also means nothing ever moves them again
# without this file.
#
# npm is deliberately absent. `npm audit --audit-level=high` already gates
# every push and sits at zero findings at every level, and `next` is pinned
# exactly at 16.3.0 for a security reason, so npm pull requests would mostly
# propose moving a pin that was set on purpose.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    # A freshly published action version is the one most likely to be
    # compromised or broken, and every action here is SHA pinned, so waiting a
    # week before proposing a move costs nothing and skips that window.
    # `p/default` blocks a dependabot config without this, which is how the
    # first version of this file turned CI red.
    cooldown:
      default-days: 7
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore"
